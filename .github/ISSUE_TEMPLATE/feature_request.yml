name: Feature request
description: Suggest a focused improvement
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What have you tried or considered?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Links, examples, screenshots, or related issues.
    validations:
      required: false

